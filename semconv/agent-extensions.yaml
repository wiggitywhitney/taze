groups:
  - id: registry.taze.agent_extensions
    type: attribute_group
    display_name: Agent-Created Attributes
    brief: Attributes created by the instrumentation agent
    attributes:
      - id: taze.config.sources_found
        type: int
        stability: development
        brief: Number of configuration source files found during dependency resolution
        examples:
          - 1
          - 3
      - id: taze.cache.hit
        type: boolean
        stability: development
        brief: Whether the package metadata was served from cache
      - id: taze.cache.changed
        type: boolean
        stability: development
        brief: Whether the cache entry was modified during this operation
      - id: taze.package.deps_count
        type: int
        stability: development
        brief: "Agent-discovered attribute: taze.package.deps_count"
      - id: taze.catalog.count
        type: int
        stability: development
        brief: "Agent-discovered attribute: taze.catalog.count"
  - id: span.taze.check.global
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.global"
    span_kind: internal
  - id: span.taze.package.load_pnpm_global
    type: span
    stability: development
    brief: "Agent-discovered span: taze.package.load_pnpm_global"
    span_kind: internal
  - id: span.taze.package.load_npm_global
    type: span
    stability: development
    brief: "Agent-discovered span: taze.package.load_npm_global"
    span_kind: internal
  - id: span.taze.package.install
    type: span
    stability: development
    brief: "Agent-discovered span: taze.package.install"
    span_kind: internal
  - id: span.taze.check.run
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.run"
    span_kind: internal
  - id: span.taze.check.interactive
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.interactive"
    span_kind: internal
  - id: span.taze.config.resolve
    type: span
    stability: development
    brief: "Agent-discovered span: taze.config.resolve"
    span_kind: internal
  - id: span.taze.package.load_bun_workspace
    type: span
    stability: development
    brief: "Agent-discovered span: taze.package.load_bun_workspace"
    span_kind: internal
  - id: span.taze.write.bun_workspace
    type: span
    stability: development
    brief: "Agent-discovered span: taze.write.bun_workspace"
    span_kind: internal
  - id: span.taze.write.bun_json
    type: span
    stability: development
    brief: "Agent-discovered span: taze.write.bun_json"
    span_kind: internal
