groups:
  - id: registry.taze.agent_extensions
    type: attribute_group
    display_name: Agent-Created Attributes
    brief: Attributes created by the instrumentation agent
    attributes:
      - id: taze.config.sources_found
        type: int
        stability: development
        brief: Number of configuration source files found during dependency resolution
        examples:
          - 1
          - 3
      - id: taze.cache.hit
        type: boolean
        stability: development
        brief: Whether the package metadata was served from cache
      - id: taze.cache.changed
        type: boolean
        stability: development
        brief: Whether the cache entry was modified during this operation
  - id: span.taze.check.global
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.global"
    span_kind: internal
  - id: span.taze.check.load_global_pnpm
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.load_global_pnpm"
    span_kind: internal
  - id: span.taze.check.load_global_npm
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.load_global_npm"
    span_kind: internal
  - id: span.taze.check.install_pkg
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.install_pkg"
    span_kind: internal
  - id: span.taze.check.run
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.run"
    span_kind: internal
  - id: span.taze.check.interactive
    type: span
    stability: development
    brief: "Agent-discovered span: taze.check.interactive"
    span_kind: internal
